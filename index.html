<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08070d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308070d'/%3E%3Cpath d='M16 3l9 13-9 13L7 16z' fill='%23f6c861'/%3E%3Cpath d='M16 8l5 8-5 8-5-8z' fill='%237a49ff'/%3E%3C/svg%3E" />
    <title>魔塔：紫焰试炼</title>
  </head>
  <body>
    <div id="app">
      <section class="game-shell">
        <header class="topbar">
          <div class="brand-lockup">
            <span class="brand-mark"></span>
            <div>
              <strong>魔塔：紫焰试炼</strong>
              <span>Phaser MVP · JSON Driven</span>
            </div>
          </div>
          <div class="top-actions">
            <div class="settings-wrap">
              <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings-root">声音</button>
              <div id="settings-root" class="settings-popover" hidden></div>
            </div>
            <button id="resetRun" type="button">重开</button>
          </div>
        </header>
        <main class="play-layout">
          <aside id="hud-root" class="hud-column" aria-label="角色状态"></aside>
          <section class="stage-wrap">
            <div id="game-root" aria-label="魔塔游戏画布"></div>
            <div id="toast-root" class="toast-root" aria-live="polite"></div>
            <div id="victory-root" class="victory-root" aria-live="polite"></div>
            <div class="control-hint">方向键 / WASD 或点击相邻格移动</div>
          </section>
          <aside id="side-root" class="side-column" aria-label="战斗与存档"></aside>
        </main>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
